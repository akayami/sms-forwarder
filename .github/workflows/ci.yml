name: CI

# Validates that the app compiles and produces a debug APK on every push
# and PR to main. Runs on GitHub-hosted ubuntu-latest: this repo is
# public, so hosted runners are free + unmetered (the org's self-hosted
# ARC pool exists for the *private* repos that consume paid minutes, and
# its runner group blocks public repos anyway). ubuntu-latest ships the
# Android SDK preinstalled, so no per-job SDK setup is needed.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build debug apk
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: sms-forwarder-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
